<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">

<script>
// apply the saved theme before the first paint (no flash of the wrong colours)
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('de-theme-v1') || '{}');
    if (t.mode === 'light' || t.mode === 'dark') document.documentElement.setAttribute('data-theme', t.mode);
    if (t.accent) document.documentElement.setAttribute('data-accent', t.accent);
  } catch (e) { /* ignore */ }
})();
</script>
<style>
:root {
  /* Layout: one column of cards, thumb-reach buttons at the bottom of each card.
     Palette: cool slate paper, dark ink, marker yellow for the gap to fill. */
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #14202B;
  --muted: #5A6978;
  --line: #D5DCE3;
  --mark: #F2B705;
  --btn: #14202B;
  --btn-ink: #FFFFFF;
  --ok: #16794C;
  --ok-bg: #E2F2E9;
  --bad: #B3362F;
  --bad-bg: #FBE7E5;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* soft ink dark: warm off-white text, lifted cards, primary buttons in the accent colour */
    --bg: #101218;
    --surface: #191C25;
    --ink: #ECE8E1;
    --muted: #9EA3B0;
    --line: #2B303D;
    --mark: #F5C451;
    --btn: var(--mark);
    --btn-ink: #15171D;
    --ok: #6BD69B;
    --ok-bg: #16291F;
    --bad: #FF8E84;
    --bad-bg: #351A1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101218;
  --surface: #191C25;
  --ink: #ECE8E1;
  --muted: #9EA3B0;
  --line: #2B303D;
  --mark: #F5C451;
  --btn: var(--mark);
  --btn-ink: #15171D;
  --ok: #6BD69B;
  --ok-bg: #16291F;
  --bad: #FF8E84;
  --bad-bg: #351A1C;
  color-scheme: dark;
}
/* dark: depth from light instead of borders, a faint glow behind the page */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body { background: radial-gradient(1200px 600px at 50% -200px, #1A1E2B 0%, var(--bg) 60%) fixed, var(--bg); }
  :root:not([data-theme="light"]) .card { border-color: #252A36; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.25); }
  :root:not([data-theme="light"]) .btn.ghost, :root:not([data-theme="light"]) .row:not(.done), :root:not([data-theme="light"]) .opt:not(.right):not(.wrong),
  :root:not([data-theme="light"]) .tab:not([aria-pressed="true"]), :root:not([data-theme="light"]) .wtab:not([aria-pressed="true"]),
  :root:not([data-theme="light"]) .back, :root:not([data-theme="light"]) .pool .tok { background: #1F232E; }
  :root:not([data-theme="light"]) .fb.ok h3 { color: var(--ok); }
}
:root[data-theme="dark"] body { background: radial-gradient(1200px 600px at 50% -200px, #1A1E2B 0%, var(--bg) 60%) fixed, var(--bg); }
:root[data-theme="dark"] .card { border-color: #252A36; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.25); }
:root[data-theme="dark"] .btn.ghost, :root[data-theme="dark"] .row:not(.done), :root[data-theme="dark"] .opt:not(.right):not(.wrong),
:root[data-theme="dark"] .tab:not([aria-pressed="true"]), :root[data-theme="dark"] .wtab:not([aria-pressed="true"]),
:root[data-theme="dark"] .back, :root[data-theme="dark"] .pool .tok { background: #1F232E; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-text-size-adjust: 100%;
}
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 56px;
  /* Installed on iOS with viewport-fit=cover: keep content clear of the notch / home indicator. */
  padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
           calc(56px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  display: grid;
  gap: 14px;
}

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 700 22px/1 var(--display); letter-spacing: -0.01em; }
.brand small { font: 500 13px var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.mode {
  font-size: 13px; font-weight: 500; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface);
}

.progress { display: flex; gap: 6px; }
.seg { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.seg.cur { background: var(--mark); }
.seg.ok { background: var(--ok); }
.seg.bad { background: var(--bad); }
.seg.cur.bad { box-shadow: 0 0 0 2px var(--mark); }

.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--btn); color: var(--btn-ink); border-radius: 12px; padding: 10px 14px; font-weight: 500;
}
.banner button {
  font: 600 15px var(--body); color: inherit; background: transparent; border: 1px solid currentColor;
  border-radius: 8px; padding: 6px 12px; cursor: pointer; min-height: 36px;
}

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; display: grid; gap: 16px;
}
.title { margin: 0; font: 700 26px/1.2 var(--display); text-wrap: balance; letter-spacing: -0.01em; }
.card h2 { margin: 0 0 8px; font: 600 14px var(--body); color: var(--muted); text-transform: none; }
.txt { margin: 0; white-space: pre-line; }
.meta, .muted { margin: 0; color: var(--muted); font-size: 14px; }
.lead { margin: 0; font-size: 17px; }

.passage { border-left: 3px solid var(--mark); padding: 2px 0 2px 14px; white-space: pre-line; font-size: 16px; }
.passage strong { display: block; margin-bottom: 4px; font-family: var(--display); }

.sentence { margin: 0; font: 500 clamp(22px, 6vw, 27px)/1.7 var(--display); text-wrap: pretty; }
.sentence.q { line-height: 1.4; }
.cue {
  font: 500 15px var(--body); color: var(--muted); background: var(--bg);
  padding: 2px 10px; border-radius: 999px; white-space: nowrap; margin: 0 2px; vertical-align: 2px;
}

input.gap, input.cg {
  font: inherit; color: var(--ink); text-align: center; outline: none;
  background: color-mix(in srgb, var(--mark) 28%, transparent);
  border: 0; border-bottom: 3px solid var(--mark); border-radius: 6px 6px 0 0;
  padding: 0 6px; margin: 0 2px; min-width: 3ch; max-width: 100%;
}
input.gap:focus, input.cg:focus { background: color-mix(in srgb, var(--mark) 46%, transparent); }
input.gap:focus-visible, input.cg:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input.gap:disabled, input.cg:disabled { opacity: 1; -webkit-text-fill-color: currentColor; }
input.ok { color: var(--ok); border-bottom-color: var(--ok); background: var(--ok-bg); }
input.bad { color: var(--bad); border-bottom-color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }

.ctext { display: grid; gap: 12px; font: 400 19px/2.3 var(--body); }
.ctext p { margin: 0; }
.cw { white-space: nowrap; }
.cw .pre { font-weight: 600; }
input.cg { font: 500 19px var(--body); padding: 0 4px; }
.fix { font-size: 15px; color: var(--ok); font-weight: 600; margin-left: 4px; }

.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%;
  font: 500 16px/1.4 var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; min-height: 52px;
}
.opt .ltr { color: var(--muted); font-weight: 600; }
.opt:disabled { cursor: default; opacity: 1; color: var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }

.ta {
  width: 100%; min-height: 170px; resize: vertical; font: 400 17px/1.5 var(--body); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 13px; font-weight: 500; background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 10px; color: var(--ink);
}

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: 600 16px var(--body); min-height: 48px; padding: 0 20px; border-radius: 12px; cursor: pointer;
  border: 1px solid transparent; background: var(--btn); color: var(--btn-ink);
}
.btn.primary { flex: 1 1 140px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:focus-visible, .opt:focus-visible, .banner button:focus-visible, summary:focus-visible {
  outline: 2px solid var(--ink); outline-offset: 2px;
}

.slot:empty { display: none; }
.fb { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.fb.ok { background: var(--ok-bg); }
.fb.bad, .fb.skip { background: var(--bad-bg); }
.fb h3 { margin: 0; font: 700 18px var(--display); }
.fb.ok h3 { color: var(--ok); }
.fb.bad h3, .fb.skip h3 { color: var(--bad); }
.fb p { margin: 0; }
.fb .example { font-style: italic; }
.fb .lbl, .entry .lbl { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 600; margin-right: 6px; }
.fb ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.fb .learn { font-weight: 600; font-size: 15px; }
.tag.again { color: var(--ink); border-color: var(--mark); background: color-mix(in srgb, var(--mark) 28%, transparent); }
.fb .evidence { font-size: 15px; color: var(--muted); }
.tag {
  justify-self: start; font-size: 12px; font-weight: 600; color: var(--muted);
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px;
}

.score { display: flex; align-items: baseline; gap: 4px; font-family: var(--display); }
.score .big { font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { font-size: 26px; color: var(--muted); font-weight: 500; }
.block { display: grid; gap: 4px; }
ul.tags, ul.wrong { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.tags li { display: flex; align-items: center; gap: 10px; }
ul.tags .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }
ul.wrong li { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
ul.wrong li:last-child { border-bottom: 0; padding-bottom: 0; }
ul.wrong s { color: var(--bad); }
ul.wrong b { color: var(--ok); }
.sent { color: var(--muted); font-size: 14px; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 500; color: var(--muted); }
details textarea { margin-top: 10px; min-height: 120px; font: 400 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
.err { color: var(--bad); font-size: 14px; margin: 6px 0 0; }

.right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { white-space: nowrap; }
.mode { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.back {
  font: 600 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 0 14px; min-height: 40px; cursor: pointer; white-space: nowrap;
}
.back:focus-visible, .tab:focus-visible, .row:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.stat b { display: block; font: 700 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.tab {
  position: relative; font: 600 16px var(--body); min-height: 46px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.tab[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.tab.done::after { content: '✓'; position: absolute; top: 1px; right: 5px; font-size: 11px; color: var(--ok); }
.tab[aria-pressed="true"].done::after { color: var(--mark); }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%;
  font: 500 16px/1.35 var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 54px; cursor: pointer;
}
.row small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.row .go { color: var(--muted); font-weight: 600; white-space: nowrap; font-size: 14px; }
.row.done { border-color: var(--ok); background: var(--ok-bg); }
.row.done .go { color: var(--ok); }
.row:disabled { opacity: .55; cursor: default; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.sub a { color: var(--ink); }
.grp { border-top: 1px solid var(--line); padding-top: 10px; }
.grp > summary { font: 600 17px var(--display); color: var(--ink); padding: 6px 0; }
.grp[open] > summary { margin-bottom: 8px; }
.grp .rows { margin-top: 8px; }
.weak { display: flex; flex-wrap: wrap; gap: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .seg { transition: background-color .2s; }
}

/* translation aids */
.w { cursor: pointer; text-decoration: underline dotted color-mix(in srgb, var(--muted) 70%, transparent); text-underline-offset: 4px; text-decoration-thickness: 1px; border-radius: 4px; }
.w:hover, .w.on { background: color-mix(in srgb, var(--mark) 30%, transparent); }
.pop {
  position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 24px)); padding: 8px 12px; border-radius: 10px;
  background: var(--btn); color: var(--btn-ink); font: 500 15px/1.4 var(--body); box-shadow: 0 6px 24px rgba(0,0,0,.22);
}
.trline { margin: 0; color: var(--muted); font: 400 16px/1.45 var(--body); border-left: 3px solid var(--line); padding: 2px 0 2px 12px; white-space: pre-line; }
.trline::before { content: 'Překlad: '; font-weight: 600; }
.trline.bare::before { content: none; }
.opt .otr { display: block; color: var(--muted); font-size: 14px; font-weight: 400; margin-top: 2px; }
.opt > span:last-child { display: block; }
.pas-tools { display: flex; gap: 8px; }
.mini {
  font: 600 13px var(--body); color: var(--muted); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; min-height: 32px;
}
.mini:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.fb .trf { color: var(--ink); }
.fb .trf .lbl { font-style: normal; }

/* cheat sheet */
.sheet { display: grid; gap: 10px; }
.sheet h3 { margin: 6px 0 0; font: 600 15px var(--body); }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 13px; color: var(--muted); font-weight: 600; }
.tbl td:first-child { color: var(--muted); white-space: nowrap; font-size: 13px; }
.tbl b { font-weight: 600; }
.scroll { overflow-x: auto; }

/* accent colours (Nastavení → Vzhled); dark values are brighter so they keep contrast */
:root[data-accent="blue"] { --mark: #3B82F6; }
:root[data-accent="green"] { --mark: #22A06B; }
:root[data-accent="pink"] { --mark: #E4577F; }
:root[data-accent="violet"] { --mark: #8B5CF6; }
:root[data-accent="orange"] { --mark: #F07B22; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="blue"]:not([data-theme="light"]) { --mark: #6AA8FF; }
  :root[data-accent="green"]:not([data-theme="light"]) { --mark: #4CD38E; }
  :root[data-accent="pink"]:not([data-theme="light"]) { --mark: #FF86A6; }
  :root[data-accent="violet"]:not([data-theme="light"]) { --mark: #B39DFF; }
  :root[data-accent="orange"]:not([data-theme="light"]) { --mark: #FF9D57; }
}
:root[data-theme="dark"][data-accent="blue"] { --mark: #6AA8FF; }
:root[data-theme="dark"][data-accent="green"] { --mark: #4CD38E; }
:root[data-theme="dark"][data-accent="pink"] { --mark: #FF86A6; }
:root[data-theme="dark"][data-accent="violet"] { --mark: #B39DFF; }
:root[data-theme="dark"][data-accent="orange"] { --mark: #FF9D57; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--surface) inset; }
.swatch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* course: weeks, theory */
.wtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.wtab { font: 600 14px var(--body); min-height: 38px; padding: 0 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.wtab[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.wtab.done { border-color: var(--ok); }
.wbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.wbar > span { display: block; height: 100%; background: var(--ok); }
.theory { display: grid; gap: 12px; }
.theory h3 { margin: 6px 0 0; font: 700 18px var(--display); }
.theory p { margin: 0; }
.theory .tip { background: color-mix(in srgb, var(--mark) 22%, transparent); border-left: 3px solid var(--mark); padding: 8px 12px; border-radius: 0 10px 10px 0; }
.theory .exs { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.theory .exs li { display: grid; gap: 1px; }
.theory .exs .de { font-weight: 600; }
.theory .exs .cz { color: var(--muted); font-size: 14px; }
.row.theory-row { border-style: dashed; }
.today { display: grid; gap: 10px; }

/* new item kinds */
.cz-prompt { margin: 0; font: 500 clamp(20px, 5.4vw, 24px)/1.4 var(--display); }
.pool, .built { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
.built { border-bottom: 2px dashed var(--line); padding-bottom: 10px; }
.tok { font: 500 17px var(--body); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 42px; }
.tok:disabled { opacity: .35; cursor: default; }
.built .tok { background: color-mix(in srgb, var(--mark) 22%, transparent); border-color: var(--mark); }
.marks { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 17px; line-height: 1.6; }
.mk { border-radius: 6px; padding: 0 4px; }
.mk.bad, .mk.extra { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; }
.mk.typo { background: color-mix(in srgb, var(--mark) 30%, transparent); }
.mk.moved { background: color-mix(in srgb, var(--mark) 45%, transparent); box-shadow: inset 0 -2px 0 var(--mark); }
.mk.miss { color: var(--ok); font-weight: 700; }
.cd del { color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
.cd ins { color: var(--ok); background: var(--ok-bg); text-decoration: none; font-weight: 700; }
.diag { display: grid; gap: 6px; margin: 0; padding-left: 18px; }
.fb .tips { color: var(--muted); font-size: 14px; }
.chk { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; }
.chk .y { color: var(--ok); } .chk .n { color: var(--bad); }
.play { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.play .btn { min-height: 52px; }
.audio-hidden { color: var(--muted); font-style: italic; }
.ai { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
.ai h4 { margin: 0; font: 600 15px var(--body); }
.say { font: 600 13px var(--body); border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 2px 10px; min-height: 30px; cursor: pointer; }

/* dictionary overlay */
.ov { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ov .app { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.ov-head { display: flex; gap: 8px; align-items: center; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 1; }
.ov-head input { flex: 1; font: 400 18px var(--body); min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; }
.ov-head input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.dtabs { display: flex; gap: 6px; }
.entry { display: grid; gap: 8px; }
.entry .hw { font: 700 24px var(--display); margin: 0; }
.entry .gram { color: var(--muted); font-size: 14px; margin: 0; }
.entry ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.entry .cs { font-weight: 600; font-size: 17px; }
.entry .note { font-size: 14px; color: var(--muted); }
.entry .ex { font-style: italic; }
.reslist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pop .pop-act { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pop .pop-act button { font: 600 13px var(--body); color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.w.k { text-decoration: underline dotted color-mix(in srgb, var(--muted) 70%, transparent); }
.w:not(.k) { text-decoration: none; }

/* character sheet */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 16px; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; font: 700 26px var(--display); }
.lvl { font: 700 15px var(--body); color: var(--muted); }
.skills { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.skill { display: grid; gap: 4px; }
.skill .top { display: flex; align-items: baseline; gap: 8px; }
.skill .ic { width: 26px; text-align: center; color: var(--muted); font-weight: 700; }
.skill .nm { font-weight: 600; flex: 1; }
.skill .lv { font: 700 15px var(--display); font-variant-numeric: tabular-nums; }
.skill .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin-left: 34px; }
.skill .bar > span { display: block; height: 100%; background: var(--mark); }
.skill .sub2 { margin-left: 34px; font-size: 13px; color: var(--muted); }
.skill.locked { opacity: .55; }
.cefr { font: 700 13px var(--body); padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--mark) 30%, transparent); border: 1px solid var(--mark); }
.cefr-line { display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.cefr-line .ok { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Deutsch Up<small>A2 → B1</small><small id="brandver"></small></div>
    <div class="right"><div class="mode" id="mode" hidden></div><button class="back" id="dictbtn" type="button" aria-label="Slovník">Slovník</button><button class="back" id="back" type="button" hidden>‹ Přehled</button></div>
  </header>
  <div class="progress" id="progress" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <main id="stage"></main>
</div>
<div class="ov" id="overlay" hidden role="dialog" aria-modal="true" aria-label="Slovník"></div>

<script src="bank.js"></script>
<script src="js/diagnose.js"></script>
<script src="js/speech.js"></script>
<script src="js/dict.js"></script>
<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var progressEl = document.getElementById('progress');
  var bannerEl = document.getElementById('banner');
  var modeEl = document.getElementById('mode');
  var backEl = document.getElementById('back');

  var ex = null, baseEx = null, retryMode = false;
  var phase = 'empty';     // empty | hub | intro | item | summary
  var idx = 0, outcomes = [], result = null, savedState = 'none';
  // Learn loop (like Quizlet "Learn"): queue = item indexes still to answer, learn[i] = mastery state.
  // A missed item comes back a few items later and must then be answered correctly twice in a row.
  var queue = [], learn = [];
  var REQUEUE_BAD = 3, REQUEUE_OK = 6;
  var BANK = window.BANK || null;
  var setById = {}, itemIndex = {};
  var session = null, hubDay = 0;
  var LS_KEY = 'de-prog-v1';
  var SYNC_KEY = 'de-sync-v1';

  var OK_LINES = ['Přesně tak.', 'Sedí.', 'Správně.', 'Dobře, jedeme dál.'];

  function h(tag, props) {
    var el = document.createElement(tag);
    var p = props || {};
    for (var k in p) {
      var v = p[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    var kids = Array.prototype.slice.call(arguments, 2);
    (function add(list) {
      list.forEach(function (x) {
        if (x === null || x === undefined || x === false) return;
        if (Array.isArray(x)) add(x); else el.append(x);
      });
    })(kids);
    return el;
  }

  function arr(v) { return Array.isArray(v) ? v : [v]; }
  // ß = ss and ä = ae etc. count as the same spelling (keyboards without umlauts)
  function norm(s) {
    if (window.DU_DIAG) return window.DU_DIAG.norm(s);
    return String(s === null || s === undefined ? '' : s).trim().toLowerCase()
      .replace(/ß/g, 'ss').replace(/\s+/g, ' ').replace(/[.,;:!?]+$/, '');
  }
  var DIAG = window.DU_DIAG || null;
  var SPEAK = window.DU_SPEAK || null;
  var DICT = window.DU_DICT || null;
  function matches(given, expected) {
    var g = norm(given);
    return arr(expected).some(function (e) { return norm(e) === g; });
  }
  function stripCue(t) { return String(t).replace(/\s*\([^)]*\)/g, ''); }
  function cuefy(text) {
    return String(text).split(/(\([^)]*\))/).filter(function (s) { return s !== ''; }).map(function (s) {
      return /^\(.*\)$/.test(s) ? h('span', { class: 'cue', text: s.slice(1, -1) }) : s;
    });
  }
  function plural(n) { return n === 1 ? 'úkol' : (n >= 2 && n <= 4 ? 'úkoly' : 'úkolů'); }

  /* ---------- translation helpers ---------- */
  var GL = (BANK && BANK.gloss) || {};
  var AD = (BANK && BANK.adj) || {};
  function gloss(w) {
    var k = String(w).toLowerCase();
    if (GL[k]) return GL[k];
    if (AD[k]) return k + ' = ' + AD[k];
    var sufs = ['en', 'em', 'er', 'es', 'e'];
    for (var i = 0; i < sufs.length; i++) {
      var s = sufs[i];
      if (k.length > s.length + 2 && k.slice(-s.length) === s) {
        var st = k.slice(0, -s.length);
        if (AD[st]) return st + ' = ' + AD[st] + ' (koncovka -' + s + ')';
      }
    }
    return null;
  }
  // German text -> nodes; every word is tappable (dictionary), words with a quick gloss are underlined
  function deText(text) {
    var out = [];
    String(text).split(/([A-Za-zÄÖÜäöüßéÉ]+)/).forEach(function (part, i) {
      if (!part) return;
      if (i % 2 === 1 && part.length > 1) {
        var g = gloss(part);
        out.push(h('span', { class: g ? 'w k' : 'w', 'data-g': g || null, 'data-w': part, role: 'button', tabindex: '0', text: part }));
        return;
      }
      out.push(part);
    });
    return out;
  }
  function cuefyDe(text, plain) {
    return String(text).split(/(\([^)]*\))/).filter(function (s) { return s !== ''; }).map(function (s) {
      if (/^\(.*\)$/.test(s)) return h('span', { class: 'cue', text: s.slice(1, -1) });
      return plain ? s : deText(s);
    });
  }
  var popEl = null, popFor = null;
  function hidePop() {
    if (popEl) { popEl.remove(); popEl = null; }
    if (popFor) { popFor.classList.remove('on'); popFor = null; }
  }
  function placePop(el) {
    if (!popEl) return;
    var r = el.getBoundingClientRect(), pw = popEl.offsetWidth, ph = popEl.offsetHeight;
    var left = Math.max(12, Math.min(window.innerWidth - pw - 12, r.left + r.width / 2 - pw / 2));
    var top = r.bottom + 8;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
    popEl.style.left = left + 'px'; popEl.style.top = top + 'px';
  }
  function showPop(el) {
    if (popFor === el) { hidePop(); return; }
    hidePop();
    popFor = el; el.classList.add('on');
    var word = el.getAttribute('data-w') || el.textContent;
    var txt = h('span', { text: el.getAttribute('data-g') || (DICT ? 'Hledám ve slovníku…' : word) });
    var act = h('div', { class: 'pop-act' });
    popEl = h('div', { class: 'pop', role: 'status' }, txt, act);
    if (SPEAK && SPEAK.supported()) act.append(h('button', { type: 'button', text: '🔊', 'aria-label': 'Přečíst', onclick: function (e) { e.stopPropagation(); SPEAK.say(word); } }));
    if (DICT) act.append(h('button', { type: 'button', text: 'Slovník', onclick: function (e) { e.stopPropagation(); hidePop(); openDict(word); } }));
    document.body.append(popEl);
    placePop(el);
    if (!DICT) return;
    var mine = popEl;
    DICT.lookup(word).then(function (list) {
      if (popEl !== mine) return;
      var e = list[0];
      if (!e) { if (!el.getAttribute('data-g')) txt.textContent = word + ' – ve slovníku není'; placePop(el); return; }
      if (!el.getAttribute('data-g')) txt.textContent = shortDef(e);
      var key = wordKey(e);
      // looking a word up during an exercise = an encountered word
      if (phase === 'item' && autoWords() && !prog.words[key] && /^(noun|verb|adj|adv)$/.test(e.p) && !e._guess) {
        addWord(e); prog.words[key].src = 'tap'; saveLocal();
      }
      var b = h('button', { type: 'button', text: myWord(key) ? (prog.words[key].src === 'tap' ? '✓ Přidáno do slovíček' : '✓ Ve slovíčkách') : '+ Do slovíček' });
      b.addEventListener('click', function (ev) { ev.stopPropagation(); if (!myWord(key)) { addWord(e); b.textContent = '✓ Ve slovíčkách'; } });
      act.append(b);
      placePop(el);
    }).catch(function () { if (popEl === mine && !el.getAttribute('data-g')) { txt.textContent = word + ' – slovník se nepodařilo načíst'; placePop(el); } });
  }
  document.addEventListener('click', function (e) {
    if (popEl && popEl.contains(e.target)) return;
    var t = e.target.closest ? e.target.closest('.w') : null;
    if (t) { e.preventDefault(); showPop(t); } else hidePop();
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('w')) { e.preventDefault(); showPop(e.target); }
    if (e.key === 'Escape') hidePop();
  });
  window.addEventListener('scroll', hidePop, { passive: true });
  function isVocab(it) { return it && it._g === 'slov'; }
  // "Překlad" toggle: shows Czech line after anchor
  function trToggle(ctx, text, onToggle) {
    if (!text) return;
    var line = null;
    var b = h('button', { class: 'btn ghost', type: 'button', text: 'Překlad', 'aria-expanded': 'false' });
    b.addEventListener('click', function () {
      if (line) { line.remove(); line = null; b.setAttribute('aria-expanded', 'false'); if (onToggle) onToggle(false); return; }
      line = h('p', { class: 'trline', text: text });
      ctx.trAnchor.after(line);
      b.setAttribute('aria-expanded', 'true');
      if (onToggle) onToggle(true);
    });
    ctx.actions.append(b);
    ctx.trLine = function () { return line; };
  }
  function validEx(o) {
    return !!o && typeof o === 'object' && typeof o.id === 'string' && Array.isArray(o.items) && o.items.length > 0;
  }

  /* ---------- rendering ---------- */

  function render() {
    renderProgress();
    stage.replaceChildren();
    backEl.hidden = phase === 'hub' || phase === 'empty';
    if (phase === 'hub') { modeEl.hidden = true; }
    else if (ex) { modeEl.textContent = ex.mode || ''; modeEl.hidden = !ex.mode || !!ex.bank; }
    if (phase === 'theory' || phase === 'sheet') { modeEl.hidden = true; }
    if (phase === 'hub') stage.append(hubView());
    else if (phase === 'theory') stage.append(theoryView());
    else if (phase === 'sheet') stage.append(sheetView());
    else if (phase === 'empty') stage.append(emptyCard());
    else if (phase === 'intro') stage.append(introCard());
    else if (phase === 'item') stage.append(itemCard());
    else stage.append(summaryCard());
    if (phase === 'item') {
      var f = stage.querySelector('input.gap:not(:disabled), input.cg:not(:disabled), textarea:not(:disabled)');
      if (f) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    }
  }

  function renderProgress() {
    progressEl.replaceChildren();
    if (!ex || phase === 'empty' || phase === 'summary') { progressEl.hidden = true; return; }
    progressEl.hidden = false;
    var nDone = 0;
    ex.items.forEach(function (_, i) {
      var L = learn[i] || {};
      var cls = 'seg';
      if (L.done) { cls += ' ok'; nDone += 1; }
      else if (L.missed) cls += ' bad';
      if (phase === 'item' && i === idx && !L.done) cls += ' cur';
      progressEl.append(h('span', { class: cls }));
    });
    progressEl.setAttribute('aria-label', 'Zvládnuto ' + nDone + ' z ' + ex.items.length);
  }

  function emptyCard() {
    var msg = 'Banku cvičení se nepodařilo načíst. Zkus aplikaci znovu otevřít, nebo cvičení vlož ručně.';
    var ta = h('textarea', { class: 'ta', rows: '6', 'aria-label': 'Cvičení ve formátu JSON', spellcheck: 'false' });
    var err = h('p', { class: 'err', hidden: true });
    var load = function () {
      try {
        var o = JSON.parse(ta.value);
        if (!validEx(o)) throw new Error('bad');
        loadExercise(o, { fresh: true });
      } catch (e) {
        err.textContent = 'Tohle není platné cvičení. Zkontroluj, že jsi zkopíroval celý JSON.';
        err.hidden = false;
      }
    };
    return h('section', { class: 'card' },
      h('h1', { class: 'title', text: 'Zatím žádné cvičení' }),
      h('p', { class: 'txt', text: msg }),
      h('details', {}, h('summary', { text: 'Vložit cvičení ručně' }), ta, err,
        h('div', { class: 'actions', style: 'margin-top:10px' },
          h('button', { class: 'btn', type: 'button', onclick: load, text: 'Načíst' }))));
  }

  function introCard() {
    var n = ex.items.length;
    return h('section', { class: 'card' },
      h('h1', { class: 'title', text: ex.title || 'Cvičení' }),
      ex.intro ? h('p', { class: 'txt', text: ex.intro }) : null,
      h('p', { class: 'meta', text: n + ' ' + plural(n) + ' · co spleteš, vrátí se, dokud to dvakrát po sobě nedáš správně' }),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', type: 'button', text: 'Začít',
          onclick: function () { phase = 'item'; idx = queue[0]; render(); } })));
  }

  function passageEl(p) {
    var title = typeof p === 'object' && p ? p.title : null;
    var text = typeof p === 'object' && p ? p.text : String(p);
    var tr = typeof p === 'object' && p ? p.tr : null;
    var box = h('div', { class: 'passage' }, title ? h('strong', {}, deText(title)) : null, deText(text));
    if (!tr) return box;
    var line = null;
    var b = h('button', { class: 'mini', type: 'button', text: 'Přeložit text', 'aria-expanded': 'false' });
    b.addEventListener('click', function () {
      if (line) { line.remove(); line = null; b.textContent = 'Přeložit text'; b.setAttribute('aria-expanded', 'false'); return; }
      line = h('p', { class: 'trline bare', text: tr });
      wrap.append(line);
      b.textContent = 'Skrýt překlad'; b.setAttribute('aria-expanded', 'true');
    });
    var wrap = h('div', { style: 'display:grid;gap:10px' }, box, h('div', { class: 'pas-tools' }, b));
    return wrap;
  }

  function itemCard() {
    var it = ex.items[idx];
    var kind = it.kind || 'fill';
    var rep = learn[idx] && learn[idx].tries > 0;
    var card = h('section', { class: 'card', 'data-id': it.id || null, 'data-rep': rep ? '1' : null });
    if (rep) card.append(h('span', { class: 'tag again', text: 'Znovu' }));
    var slot = h('div', { class: 'slot', 'aria-live': 'polite' });
    var actions = h('div', { class: 'actions' });
    var ctx = { it: it, card: card, slot: slot, actions: actions, idx: idx };
    var pas = it.passage || ex.passage;
    if (pas && pas.audio) { ctx.audio = audioPassage(pas); card.append(ctx.audio.el); }
    else if (pas) card.append(passageEl(pas));
    if (it.long) card.append(h('span', { class: 'tag again', text: 'Delší věta' }));
    if (kind === 'choice') buildChoice(ctx);
    else if (kind === 'ctest') buildCtest(ctx);
    else if (kind === 'write') buildWrite(ctx);
    else if (kind === 'order') buildOrder(ctx);
    else if (kind === 'sentence') buildSentence(ctx);
    else if (kind === 'listen') buildListen(ctx);
    else buildFill(ctx);
    card.append(slot, actions);
    return card;
  }

  /* ---------- item kinds ---------- */

  function filled(it) {
    return stripCue(String(it.prompt).replace('___', arr(it.answer)[0])).trim();
  }

  function buildFill(ctx) {
    var it = ctx.it;
    var first = String(arr(it.answer)[0]);
    var pieces = String(it.prompt).split('___');
    var left = pieces.shift();
    var right = pieces.join('___');
    var input = h('input', {
      class: 'gap', type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off',
      spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'Doplň chybějící slovo'
    });
    input.style.width = Math.max(4, first.length + 2) + 'ch';
    var plain = isVocab(it);
    var sent = h('p', { class: 'sentence' }, cuefyDe(left, plain), input, cuefyDe(right, plain));
    ctx.card.append(sent);
    ctx.trAnchor = sent;

    var hintEl = null;
    var check = function () {
      var v = input.value;
      if (!norm(v)) { input.focus(); return; }
      var ok = matches(v, it.answer);
      input.disabled = true;
      input.classList.add(ok ? 'ok' : 'bad');
      complete(ctx, [{ given: v.trim(), expected: first, correct: ok, tag: it.tag || '', skipped: false }],
        { label: filled(it) });
    };
    var skip = function () {
      input.disabled = true;
      input.classList.add('bad');
      complete(ctx, [{ given: '', expected: first, correct: false, tag: it.tag || '', skipped: true }],
        { label: filled(it), skipped: true });
    };
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); check(); }
    });
    ctx.actions.append(
      h('button', { class: 'btn primary', type: 'button', onclick: check, text: 'Zkontrolovat' }),
      h('button', { class: 'btn ghost', type: 'button', onclick: skip, text: 'Nevím' }));
    trToggle(ctx, it.tr);
    if (it.hint) {
      ctx.actions.append(h('button', { class: 'btn ghost', type: 'button', text: 'Nápověda', onclick: function () {
        if (hintEl) return;
        hintEl = h('p', { class: 'meta', text: it.hint });
        ctx.slot.append(hintEl);
        input.focus();
      } }));
    }
  }

  function buildChoice(ctx) {
    var it = ctx.it;
    var qEl = h('p', { class: 'sentence q' }, isVocab(it) ? it.q : deText(it.q));
    ctx.card.append(qEl);
    ctx.trAnchor = qEl;
    var list = h('div', { class: 'opts', role: 'group' });
    var otrs = [];
    var order = it.options.map(function (_, i) { return i; });
    if (learn[idx] && learn[idx].tries > 0) order = shuffle(order); // a repeat must not be solvable by position
    var btns = [];
    order.forEach(function (i, pos) {
      var o = it.options[i];
      var otr = it.optTr && it.optTr[i] ? h('span', { class: 'otr', hidden: true, text: it.optTr[i] }) : null;
      if (otr) otrs.push(otr);
      var b = h('button', { class: 'opt', type: 'button' },
        h('span', { class: 'ltr', text: String.fromCharCode(97 + pos) + ')' }), h('span', {}, o, otr));
      b.addEventListener('click', function () { done(i, false); });
      btns[i] = b;
      list.append(b);
    });
    ctx.card.append(list);
    function done(i, skipped) {
      if (ctx.audio) ctx.audio.reveal();
      if (SPEAK) SPEAK.stop();
      otrs.forEach(function (x) { x.hidden = false; });
      btns.forEach(function (b, j) {
        b.disabled = true;
        if (j === it.answer) b.classList.add('right');
        else if (j === i) b.classList.add('wrong');
      });
      complete(ctx, [{
        given: skipped ? '' : it.options[i], expected: it.options[it.answer],
        correct: !skipped && i === it.answer, tag: it.tag || '', skipped: skipped
      }], { label: it.q, skipped: skipped });
    }
    ctx.actions.append(h('button', { class: 'btn ghost', type: 'button', text: 'Nevím',
      onclick: function () { done(-1, true); } }));
    trToggle(ctx, it.tr, function (on) { otrs.forEach(function (x) { x.hidden = !on; }); });
  }

  function buildCtest(ctx) {
    var it = ctx.it;
    var gaps = [];
    var okGaps = (learn[idx] && learn[idx].okGaps) || [];
    var re = /\{\{([^|}]*)\|([^|}]*)(?:\|([^|}]*))?(?:\|([^}]*))?\}\}/g;
    var wrap = h('div', { class: 'ctext' });
    String(it.text).split(/\n\s*\n/).forEach(function (para) {
      var p = h('p');
      var last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(para))) {
        if (m.index > last) p.append.apply(p, deText(para.slice(last, m.index)));
        var pre = m[1], post = m[2];
        var inp = h('input', {
