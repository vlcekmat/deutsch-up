name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only redeploy when the shipped site changes, so tests/docs pushes don't trigger an update prompt.
    paths: ['site/**', 'tools/stamp.js', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stamps site/sw.js with the commit SHA and the full precache list, so every deploy gets a new cache.
      - name: Stamp service worker
        run: node tools/stamp.js site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
